<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Communications — First UMC of Park Ridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #6817EB;
      --purple-dark: #5512c4;
      --blue: #0972EB;
      --green: #17A637;
      --red: #FF0E00;
      --orange: #FF8100;
      --ochre: #F7A800;
      --black: #000000;
      --white: #FFFFFF;
      --bg: #F6F6F6;
      --bg-mid: #E8E8E8;
      --border: #D0D0D0;
      --text: #000000;
      --text-light: #555555;
      --error: #FF0E00;
      --success: #17A637;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: var(--purple);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .header-logo {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: 'EB Garamond', serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .header-text p {
      font-size: 0.95rem;
      font-weight: 300;
      opacity: 0.9;
      margin-top: 0.15rem;
    }

    .rainbow-bar {
      height: 5px;
      background: linear-gradient(to right,
        #FF0E00 0%, #FF0E00 16.66%,
        #FF8100 16.66%, #FF8100 33.33%,
        #F7A800 33.33%, #F7A800 50%,
        #17A637 50%, #17A637 66.66%,
        #0972EB 66.66%, #0972EB 83.33%,
        #6817EB 83.33%, #6817EB 100%
      );
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .intro {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.65;
    }

    .intro strong { color: var(--text); }

    .form-section {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .form-section h2 {
      font-family: 'EB Garamond', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--blue);
    }

    .form-group { margin-bottom: 1.15rem; }
    .form-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    label .required { color: var(--error); margin-left: 2px; }
    label .hint {
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--text-light);
      display: block;
      margin-top: 0.15rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-family: 'Roboto', sans-serif;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(104, 23, 235, 0.12);
    }

    textarea { resize: vertical; min-height: 100px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.15rem;
    }
    .row:last-child { margin-bottom: 0; }

    /* When two side-by-side fields have unequal label heights (e.g., one has a
       hint and the other doesn't), line up their inputs along the bottom.
       Force both form-groups to have the SAME bottom margin so they stretch
       to the same height inside the grid cell. Then a flex column with
       margin-top: auto on the input pushes it to the bottom edge. */
    .row > .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
    }
    .row > .form-group > input,
    .row > .form-group > select,
    .row > .form-group > textarea {
      margin-top: auto;
    }

    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
      .header-inner { flex-direction: column; gap: 0.75rem; }
      .header-logo { width: 60px; height: 60px; }
    }

    /* ─── Mode Selector Cards ─── */
    /* Flexbox + center justification so a partial row (e.g., 2 of 3) sits
       centered under the full row above it instead of left-aligned. */
    .mode-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .mode-cards > .mode-card {
      flex: 0 1 calc((100% - 1.5rem) / 3);
      min-width: 0;
    }

    @media (max-width: 600px) {
      .mode-cards > .mode-card { flex-basis: 100%; }
    }

    .mode-card {
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .mode-card:hover {
      border-color: var(--purple);
      box-shadow: 0 2px 12px rgba(104, 23, 235, 0.1);
      transform: translateY(-1px);
    }

    .mode-card.active {
      border-color: var(--purple);
      background: rgba(104, 23, 235, 0.04);
      box-shadow: 0 2px 12px rgba(104, 23, 235, 0.15);
    }

    .mode-card .mode-icon {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    .mode-card .mode-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .mode-card .mode-desc {
      font-size: 0.78rem;
      color: var(--text-light);
      line-height: 1.4;
    }

    /* ─── Buttons ─── */
    .submit-btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      font-family: 'Roboto', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      background: var(--purple);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover { background: var(--purple-dark); }
    .submit-btn:disabled { background: #999; cursor: not-allowed; }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--purple);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    .status-msg {
      text-align: center;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 8px;
      font-weight: 500;
    }

    .status-msg.error {
      background: #fdecea;
      color: var(--error);
      border: 1px solid #f5b7b1;
    }

    .field-error {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    input.invalid, select.invalid, textarea.invalid {
      border-color: var(--error);
    }

    .footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-light);
      font-size: 0.8rem;
    }

    .footer a { color: var(--blue); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ─── Success Screen ─── */
    .success-screen {
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .success-screen .checkmark {
      font-size: 3rem;
      color: var(--success);
      margin-bottom: 1rem;
    }

    .success-screen h2 {
      font-family: 'EB Garamond', serif;
      color: var(--purple);
      margin-bottom: 0.75rem;
    }

    .success-screen p {
      color: var(--text-light);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .success-screen button {
      padding: 0.6rem 2rem;
      font-family: 'Roboto', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--purple);
      background: white;
      border: 2px solid var(--purple);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .success-screen button:hover {
      background: var(--purple);
      color: white;
    }

    /* ─── File Upload ─── */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--purple);
      background: rgba(104, 23, 235, 0.03);
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-area .upload-icon { font-size: 1.5rem; color: var(--purple); margin-bottom: 0.35rem; }
    .upload-area .upload-text { font-size: 0.85rem; color: var(--text-light); }
    .upload-area .upload-text strong { color: var(--purple); }

    .file-list { margin-top: 0.75rem; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.6rem;
      background: var(--bg);
      border-radius: 4px;
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
    }
    .file-item .file-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
    .file-item .file-size { color: var(--text-light); font-size: 0.75rem; margin-left: 0.5rem; flex-shrink: 0; }
    .file-item .remove-btn {
      color: var(--error); background: none; border: none;
      cursor: pointer; font-size: 1rem; padding: 0 0.25rem; margin-left: 0.5rem; flex-shrink: 0;
    }
    .file-total {
      color: var(--text-light); font-size: 0.75rem; text-align: right; padding: 0.15rem 0.6rem 0;
    }
    .upload-note {
      margin-top: 0.6rem; padding: 0.6rem 0.75rem;
      background: var(--bg); border-left: 3px solid var(--purple);
      color: var(--text); font-size: 0.85rem; line-height: 1.5;
    }

    /* ─── Privacy Note ─── */
    .privacy-note {
      background: #f0ebff;
      border: 1px solid #d4c5f9;
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      color: #4a2d8a;
      line-height: 1.5;
      margin-bottom: 1.15rem;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <img src="fumcpr_logo.jpg" alt="First UMC of Park Ridge" class="header-logo" />
    <div class="header-text">
      <h1>First United Methodist Church of Park Ridge</h1>
      <p>Church Communications</p>
    </div>
  </div>
</div>
<div class="rainbow-bar"></div>

<div class="container" id="app"></div>

<div class="footer">
  <p>First United Methodist Church of Park Ridge<br>
  418 W. Touhy Ave, Park Ridge, IL 60068<br>
  <a href="https://parkridgeumc.org">parkridgeumc.org</a></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
// ─── CONFIGURATION ───────────────────────────────────────────────
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc8cuFAKAnoqSNOhlNn6qIDff_-rNjnGo_pDlZ3RET2Wcs82rFABc4h8RQOg0IGPTzBQ/exec';
// ─────────────────────────────────────────────────────────────────

const EVENT_TYPES = [
  'Learning', 'Service', 'Social',
  'All Ages Ministries', 'Youth Event', 'Outside Organizations',
  'Collections / Fundraisers', 'UWFaith', 'Small Groups',
  'Meeting', 'Spiritual Retreat', 'Other/MISC'
];

const AUDIENCE_OPTIONS = [
  'Church members only',
  'Church members and community',
  'Primarily community/outreach'
];

const ATTENDANCE_OPTIONS = [
  '2–12 people',
  '12–25 people',
  '25–50 people',
  '50+ people'
];

const PRAYER_TYPE_OPTIONS = [
  'Illness or health',
  'Grief or loss',
  'Life transition',
  'Celebration',
  'Thanksgiving',
  'Other'
];

const PRAYER_DISTRIBUTION_OPTIONS = [
  'Just with Pastor Scott (confidential)',
  'With our Prayer Tree email list (confidential circle of members who pray for one another)',
  'With our Prayer Tree AND in the bulletin / eNews (publicly shared)'
];

const ANNOUNCEMENT_DURATION_OPTIONS = [
  '1 week',
  '2 weeks',
  '3 weeks'
];

const FUNDRAISER_TYPES = [
  'Fundraiser (raising money)',
  'Collection Drive (collecting physical items)',
  'Both — money and items'
];

const FUNDRAISER_REACH_OPTIONS = [
  'Normal — our church only',
  'Large — our church plus advertising to the surrounding community'
];

// ─── Shared Components ───────────────────────────────────────────

function Field({ name, label, required, hint, type = 'text', formData, errors, handleChange, children }) {
  return (
    <div className="form-group">
      <label>
        {label}{required && <span className="required">*</span>}
        {hint && <span className="hint">{hint}</span>}
      </label>
      {children || (
        <input
          type={type}
          name={name}
          value={formData[name] || ''}
          onChange={handleChange}
          className={errors[name] ? 'invalid' : ''}
        />
      )}
      {errors[name] && <div className="field-error">{errors[name]}</div>}
    </div>
  );
}

function FileUpload({ files, setFiles, label, hint, accept, photosOnly }) {
  const [dragover, setDragover] = React.useState(false);
  const [preparing, setPreparing] = React.useState(false);
  const MAX_FILES = 15;
  const MAX_BYTES = 35 * 1024 * 1024;       // 35 MB per file
  // Everything is base64-encoded into ONE POST to Apps Script, which caps near
  // 50 MB — and base64 inflates bytes ~33%. Keep the raw total under 35 MB so a
  // submission can't sail past the ceiling and fail after the volunteer has
  // already seen the success screen.
  const MAX_TOTAL_BYTES = 35 * 1024 * 1024;
  const IMAGE_MAX_EDGE = 2560;              // ample for flyers, eNews banners, recap grids
  const IMAGE_QUALITY = 0.88;

  // Phone photos run 3–5 MB each, so 15 of them would blow the payload ceiling.
  // Downscale images in the browser first; leave documents and video alone.
  const shrinkImage = (file) => new Promise((resolve) => {
    if (!file.type.startsWith('image/') || /gif|svg/.test(file.type)) { resolve(file); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const longEdge = Math.max(img.width, img.height);
      if (longEdge <= IMAGE_MAX_EDGE && file.size <= 2 * 1024 * 1024) {
        URL.revokeObjectURL(url); resolve(file); return;
      }
      const scale = Math.min(1, IMAGE_MAX_EDGE / longEdge);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        if (!blob || blob.size >= file.size) { resolve(file); return; }
        const name = file.name.replace(/\.(heic|heif|png|webp|tiff?|bmp)$/i, '.jpg');
        const out = new File([blob], name, { type: 'image/jpeg', lastModified: file.lastModified });
        out.originalSize = file.size;
        resolve(out);
      }, 'image/jpeg', IMAGE_QUALITY);
    };
    // HEIC and anything the browser can't decode falls through unchanged.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });

  const handleFiles = async (newFiles) => {
    const incoming = Array.from(newFiles);
    if (!incoming.length) return;

    setPreparing(true);
    const processed = [];
    const tooBig = [];
    for (const f of incoming) {
      const out = await shrinkImage(f);
      if (out.size > MAX_BYTES) { tooBig.push(f.name); continue; }
      processed.push(out);
    }
    setPreparing(false);

    const kept = [...files];
    let total = kept.reduce((sum, f) => sum + f.size, 0);
    const rejected = tooBig.map(n => `${n} — over 35 MB`);
    for (const f of processed) {
      if (kept.length >= MAX_FILES) { rejected.push(`${f.name} — over the ${MAX_FILES}-file limit`); continue; }
      if (total + f.size > MAX_TOTAL_BYTES) { rejected.push(`${f.name} — would push this submission past 35 MB total`); continue; }
      kept.push(f);
      total += f.size;
    }
    setFiles(kept);

    if (rejected.length) {
      alert('These files were not added:\n\n' + rejected.join('\n') +
        '\n\nPlease send them in a second submission, or paste a Google Drive or Dropbox link in the link field below.');
    }
  };

  const removeFile = (idx) => setFiles(prev => prev.filter((_, i) => i !== idx));
  const fmtSize = (b) => b < 1024 ? b + ' B' : b < 1024*1024 ? (b/1024).toFixed(1)+' KB' : (b/(1024*1024)).toFixed(1)+' MB';
  const totalBytes = files.reduce((sum, f) => sum + f.size, 0);

  const labelText = label || 'Upload Materials';
  const hintText = hint || 'Flyers, graphics, logos, or documents';
  const acceptValue = accept || 'image/*,.pdf,.doc,.docx,.pptx,.ai,.eps,.svg';

  return (
    <div className="form-group">
      <label>
        {labelText}
        <span className="hint">
          {hintText} — up to {MAX_FILES} {photosOnly ? 'photos' : 'files'} at a time.
          {photosOnly
            ? ' Send them straight off your phone or camera at full size; we shrink them for you, so you do not need to resize anything or worry about how large they are.'
            : ' All the files together need to stay under 35 MB.'}
        </span>
      </label>
      <div className={`upload-area ${dragover ? 'dragover' : ''}`}
           onDragOver={(e) => { e.preventDefault(); setDragover(true); }}
           onDragLeave={() => setDragover(false)}
           onDrop={(e) => { e.preventDefault(); setDragover(false); handleFiles(e.dataTransfer.files); }}>
        <input type="file" multiple accept={acceptValue}
               onChange={(e) => { handleFiles(e.target.files); e.target.value = ''; }} />
        <div className="upload-icon">&#8682;</div>
        <div className="upload-text"><strong>Click to upload</strong> or drag and drop</div>
      </div>
      {preparing && <div className="upload-note">Preparing files&hellip;</div>}
      {files.length > 0 && (
        <div className="file-list">
          {files.map((f, i) => (
            <div key={i} className="file-item">
              <span className="file-name">{f.name}{f.originalSize ? ' (resized)' : ''}</span>
              <span className="file-size">{fmtSize(f.size)}</span>
              <button type="button" className="remove-btn" onClick={() => removeFile(i)} title="Remove">&times;</button>
            </div>
          ))}
          <div className="file-total">
            {files.length} of {MAX_FILES} {photosOnly ? 'photos' : 'files'}
            {photosOnly ? '' : ' · ' + fmtSize(totalBytes) + ' of 35 MB'}
          </div>
        </div>
      )}
    </div>
  );
}

// One short video, sent the same way the photos are. Anything longer than a few
// seconds has to travel as a link — see the note this renders.
function VideoUpload({ video, setVideo, photoBytes }) {
  const MAX_VIDEO_BYTES = 30 * 1024 * 1024;
  const BUDGET_BYTES = 35 * 1024 * 1024;
  const fmtSize = (b) => b < 1024*1024 ? (b/1024).toFixed(1)+' KB' : (b/(1024*1024)).toFixed(1)+' MB';

  const handleVideo = (picked) => {
    const f = Array.from(picked)[0];
    if (!f) return;
    if (f.size > MAX_VIDEO_BYTES) {
      alert(`"${f.name}" is ${fmtSize(f.size)} — too large to upload here (30 MB maximum).\n\n` +
        'Please paste a link to it in the "Video Link" field instead. Upload it to Google Photos, ' +
        'Google Drive, Dropbox, or iCloud, then copy the share link.');
      return;
    }
    if (photoBytes + f.size > BUDGET_BYTES) {
      alert(`"${f.name}" (${fmtSize(f.size)}) plus your photos (${fmtSize(photoBytes)}) is over the ` +
        '35 MB this form can carry in one submission.\n\nEither remove some photos, or send the video ' +
        'as a link in the "Video Link" field.');
      return;
    }
    setVideo(f);
  };

  return (
    <div className="form-group">
      <label>
        Upload a Short Video
        <span className="hint">
          One video at a time, and it has to be under <strong>30 MB</strong> &mdash; only about
          20 seconds of phone video. Longer than that, use the Video Link field below instead.
        </span>
      </label>
      <div className="upload-area">
        <input type="file" accept="video/*"
               onChange={(e) => { handleVideo(e.target.files); e.target.value = ''; }} />
        <div className="upload-icon">&#8682;</div>
        <div className="upload-text"><strong>Click to choose one video</strong></div>
      </div>
      {video && (
        <div className="file-list">
          <div className="file-item">
            <span className="file-name">{video.name}</span>
            <span className="file-size">{fmtSize(video.size)}</span>
            <button type="button" className="remove-btn" onClick={() => setVideo(null)} title="Remove">&times;</button>
          </div>
        </div>
      )}
      <div className="upload-note">
        <strong>Most videos are too big to upload here, and that is expected.</strong> One minute of ordinary phone
        video runs 65 MB or more, and 4K video runs several hundred &mdash; so anything past a very short clip
        will not fit. That is a limit of what a web form can carry, not something you did wrong.
        <br/><br/>
        <strong>For any video longer than about 20 seconds, send a link instead.</strong> Upload it to Google Photos,
        Google Drive, Dropbox, or iCloud, then paste the share link in the <strong>Video Link</strong> field below.
        A link works for a video of any length, so when in doubt, use the link. Either way, please send one video
        per submission.
      </div>
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────────

function App() {
  const [mode, setMode] = React.useState(null); // 'event' | 'announcement' | 'prayer' | 'fundraiser' | 'recap'
  const [formData, setFormData] = React.useState({});
  const [errors, setErrors] = React.useState({});
  const [status, setStatus] = React.useState(null);
  const [errorMsg, setErrorMsg] = React.useState('');
  const [files, setFiles] = React.useState([]);
  const [video, setVideo] = React.useState(null);

  // Deep-link support: a "mode" query param or hash (e.g. ?mode=prayer or
  // #prayer) jumps straight to that page on load, skipping the chooser.
  // Used by the weekly worship livestream email's Prayer Request button.
  React.useEffect(() => {
    const valid = ['event', 'announcement', 'prayer', 'fundraiser', 'recap'];
    const params = new URLSearchParams(window.location.search);
    const requested = (params.get('mode') || window.location.hash.replace('#', '')).toLowerCase();
    if (valid.includes(requested)) setMode(requested);
  }, []);

  const handleChange = (e) => {
    const { name, value, type, checked } = e.target;
    setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
    if (errors[name]) setErrors(prev => ({ ...prev, [name]: null }));
  };

  const fileToBase64 = (file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });

  // <input type="time"> values are always 24-hour ("19:00"), which read as
  // military time on the submissions sheet and in notification emails
  // (Scott, 2026-06-03). Convert to friendly 12-hour am/pm at submit time.
  const to12h = (t) => {
    if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return t || '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'pm' : 'am';
    const h12 = h % 12 || 12;
    return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }

    if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
      setStatus('error');
      setErrorMsg('Form not configured yet. See SETUP-GUIDE.md to connect to Google Sheets.');
      return;
    }

    // The video rides along in the same files array, so it lands in the same
    // Drive folder as the photos and needs no separate handling downstream.
    const outgoing = video ? [...files, video] : files;

    // Everything below goes up base64-encoded in a single POST, and Apps Script
    // stops accepting somewhere near 50 MB. Because the form posts no-cors, an
    // over-size submission would fail invisibly and still show the success
    // screen — so refuse it here, where we can still say why.
    const rawBytes = outgoing.reduce((sum, f) => sum + f.size, 0);
    if (rawBytes > 35 * 1024 * 1024) {
      setStatus('error');
      setErrorMsg('This submission is too large to send (' + (rawBytes/(1024*1024)).toFixed(1) +
        ' MB of files; the limit is 35 MB). Please remove a few files and send them in a second ' +
        'submission, or paste a Google Drive or Dropbox link in the link field instead.');
      return;
    }

    setStatus('submitting');
    try {
      const fileData = await Promise.all(
        outgoing.map(async (f) => ({ name: f.name, type: f.type, size: f.size, data: await fileToBase64(f) }))
      );
      const payload = {
        timestamp: new Date().toISOString(),
        submissionType: mode,
        ...formData,
        ...(formData.startTime ? { startTime: to12h(formData.startTime) } : {}),
        ...(formData.endTime ? { endTime: to12h(formData.endTime) } : {}),
        files: fileData
      };
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      setStatus('success');
    } catch (err) {
      setStatus('error');
      setErrorMsg('Something went wrong. Please try again or contact the church office.');
    }
  };

  const validate = () => {
    const errs = {};
    if (mode === 'event') {
      if (!formData.eventName?.trim()) errs.eventName = 'Event name is required';
      if (!formData.eventDate) errs.eventDate = 'Event date is required';
      if (!formData.description?.trim()) errs.description = 'Please provide a description';
      if (!formData.audience) errs.audience = 'Please select an audience';
      if (!formData.attendance) errs.attendance = 'Please select expected attendance';
      if (!formData.contactName?.trim()) errs.contactName = 'Contact name is required';
      if (!formData.contactEmail?.trim()) errs.contactEmail = 'Contact email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.contactEmail)) errs.contactEmail = 'Please enter a valid email';
      if (!formData.eventType) errs.eventType = 'Please select an event type';
      if (formData.recurring === 'Yes' && !formData.recurrenceDetail?.trim()) errs.recurrenceDetail = 'Please describe how often';
    } else if (mode === 'announcement') {
      if (!formData.announcementTitle?.trim()) errs.announcementTitle = 'A title or subject is required';
      if (!formData.announcementText?.trim()) errs.announcementText = 'Please provide the announcement text';
      if (!formData.audience) errs.audience = 'Please select an audience';
      if (!formData.duration) errs.duration = 'Please select how long to run this';
      if (!formData.contactName?.trim()) errs.contactName = 'Contact name is required';
      if (!formData.contactEmail?.trim()) errs.contactEmail = 'Contact email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.contactEmail)) errs.contactEmail = 'Please enter a valid email';
    } else if (mode === 'prayer') {
      if (!formData.prayerFor?.trim()) errs.prayerFor = 'Please tell us who this prayer is for';
      if (!formData.prayerRequest?.trim()) errs.prayerRequest = 'Please share the prayer request';
      if (!formData.prayerDistribution) errs.prayerDistribution = 'Please choose where to share this prayer';
      if (!formData.contactName?.trim()) errs.contactName = 'Your name is required';
      if (!formData.contactEmail?.trim()) errs.contactEmail = 'Your email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.contactEmail)) errs.contactEmail = 'Please enter a valid email';
    } else if (mode === 'fundraiser') {
      if (!formData.fundraiserName?.trim()) errs.fundraiserName = 'Name is required';
      if (!formData.fundraiserType) errs.fundraiserType = 'Please select a type';
      if (!formData.cause?.trim()) errs.cause = 'Please tell us who or what this benefits';
      if (!formData.description?.trim()) errs.description = 'Please describe the fundraiser';
      if (!formData.startDate) errs.startDate = 'Start date is required';
      if (!formData.endDate) errs.endDate = 'End date is required';
      if (formData.startDate && formData.endDate && formData.endDate < formData.startDate) {
        errs.endDate = 'End date must be on or after start date';
      }
      if (!formData.whatToDonate?.trim()) errs.whatToDonate = 'Please describe what people can give';
      if (!formData.howToDonate?.trim()) errs.howToDonate = 'Please describe how people can give';
      if (!formData.reach) errs.reach = 'Please select an expected reach';
      if (!formData.hasEvent) errs.hasEvent = 'Please indicate whether there is a culminating event';
      if (formData.hasEvent === 'Yes') {
        if (!formData.eventName?.trim()) errs.eventName = 'Event name is required';
        if (!formData.eventDate) errs.eventDate = 'Event date is required';
        if (!formData.location?.trim()) errs.location = 'Location is required';
      }
      if (!formData.contactName?.trim()) errs.contactName = 'Your name is required';
      if (!formData.contactEmail?.trim()) errs.contactEmail = 'Your email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.contactEmail)) errs.contactEmail = 'Please enter a valid email';
    } else if (mode === 'recap') {
      if (!formData.eventName?.trim()) errs.eventName = 'Event name is required';
      if (!formData.reflection?.trim()) errs.reflection = 'Please share a reflection on what happened';
      if (!formData.contactName?.trim()) errs.contactName = 'Your name is required';
      if (!formData.contactEmail?.trim()) errs.contactEmail = 'Your email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.contactEmail)) errs.contactEmail = 'Please enter a valid email';
    }
    return errs;
  };

  const resetAll = () => {
    setMode(null);
    setFormData({});
    setErrors({});
    setStatus(null);
    setErrorMsg('');
    setFiles([]);
    setVideo(null);
  };

  // ─── Success Screen ──────────────────────────────────────────
  if (status === 'success') {
    const messages = {
      event: "Thank you! The communications team will review your submission and begin promoting your event. You'll be contacted if we have any questions.",
      announcement: "Thank you! The communications team will review your announcement and get it into the bulletin and eNews. You'll be contacted if we need anything.",
      prayer: "Thank you for trusting us with this. Please know that Pastor Scott and our prayer community will be holding you and those you've named in prayer. If you asked for a personal follow-up, Scott will reach out soon. Peace be with you.",
      fundraiser: "Thank you! The communications team will start building promotional materials for your fundraiser. If you indicated a culminating event, we'll set that up alongside the campaign. You'll be contacted if we have any questions.",
      recap: "Thank you for sharing this! Our communications team will review the photos and your reflection, and decide where they'll appear — likely the eNews or the website. We'll be in touch if we have any questions."
    };
    const titles = {
      event: 'Event Submitted!',
      announcement: 'Announcement Submitted!',
      prayer: 'Prayer Request Submitted!',
      fundraiser: 'Fundraiser Submitted!',
      recap: 'Photos Submitted!'
    };
    return (
      <div className="success-screen">
        <div className="checkmark">&#10003;</div>
        <h2>{titles[mode]}</h2>
        <p>{messages[mode]}</p>
        <button onClick={resetAll}>Submit Another</button>
      </div>
    );
  }

  // ─── Mode Selector ───────────────────────────────────────────
  if (!mode) {
    return (
      <div>
        <div className="intro">
          <div style={{textAlign:'center'}}><strong>Choose an option below.</strong></div>
        </div>
        <div className="mode-cards">
          <div className="mode-card" onClick={() => setMode('event')}>
            <div className="mode-icon">&#128197;</div>
            <div className="mode-title">Submit an Event</div>
            <div className="mode-desc">Schedule and promote an upcoming event through bulletin, eNews, and website.</div>
          </div>
          <div className="mode-card" onClick={() => setMode('announcement')}>
            <div className="mode-icon">&#128227;</div>
            <div className="mode-title">Post an Announcement</div>
            <div className="mode-desc">Share news, updates, or information — no event details needed.</div>
          </div>
          <div className="mode-card" onClick={() => setMode('fundraiser')}>
            <div className="mode-icon">&#127873;</div>
            <div className="mode-title">Submit a Fundraiser or Collection</div>
            <div className="mode-desc">Promote a fundraising campaign or collection drive — with or without a culminating event.</div>
          </div>
          <div className="mode-card" onClick={() => setMode('recap')}>
            <div className="mode-icon">&#128247;</div>
            <div className="mode-title">Share Photos from an Event</div>
            <div className="mode-desc">Send us photos and a brief reflection on something that just happened. We'll decide where to share them — eNews or the website.</div>
          </div>
          <div className="mode-card" onClick={() => setMode('prayer')}>
            <div className="mode-icon">&#128591;</div>
            <div className="mode-title">Prayer Request</div>
            <div className="mode-desc">Share a concern, a celebration, a thanksgiving, a grief, or a life transition — for yourself or someone you love.</div>
          </div>
        </div>
      </div>
    );
  }

  // ─── Form Props ──────────────────────────────────────────────
  const fp = { formData, errors, handleChange };

  // ─── EVENT FORM ──────────────────────────────────────────────
  if (mode === 'event') {
    return (
      <form onSubmit={handleSubmit}>
        <span className="back-link" onClick={resetAll}>&larr; Back to options</span>

        <div className="intro">
          <strong>Submit an event for promotion.</strong> Fill out this form and the communications team will create ads for the bulletin, eNews, and website. <strong>Lead time matters.</strong> Please submit at least <strong>3 weeks before</strong> your event for smaller, member-focused events, and at least <strong>6 weeks before</strong> for larger, community-facing events that need wider promotion (e.g., 50+ expected attendees, major drives, signature events). The more lead time, the more we can do to promote it well.
          <br/><br/>
          <strong>Adding a link to any text field:</strong> put the URL in parentheses right after the text you want to make clickable — for example, <strong>Sign up here (https://signup.example.com)</strong>.
        </div>

        <div className="form-section">
          <h2>Event Details</h2>
          <Field name="eventName" label="Event Name" required {...fp} />
          <div className="row">
            <Field name="eventDate" label="Event Date" required type="date" {...fp} />
            <Field name="eventType" label="Event Type" required {...fp}>
              <select name="eventType" value={formData.eventType||''} onChange={handleChange} className={errors.eventType?'invalid':''}>
                <option value="">— Select —</option>
                {EVENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
          </div>
          <div className="row">
            <Field name="startTime" label="Start Time" type="time" {...fp} />
            <Field name="endTime" label="End Time" type="time" {...fp} />
          </div>
          <Field name="location" label="Location" hint="Room name, address, or 'Virtual'" {...fp} />
          <Field name="description" label="Event Description" required hint="This will be used as the basis for all promotional copy" {...fp}>
            <textarea name="description" value={formData.description||''} onChange={handleChange}
                      className={errors.description?'invalid':''} placeholder="Tell us what the event is about, who should come, and what to expect..." />
          </Field>
        </div>

        <div className="form-section">
          <h2>Audience &amp; Scope</h2>
          <Field name="audience" label="Who is this event for?" required {...fp}>
            <select name="audience" value={formData.audience||''} onChange={handleChange} className={errors.audience?'invalid':''}>
              <option value="">— Select —</option>
              {AUDIENCE_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field name="attendance" label="Expected Attendance" required hint="Helps us decide how much promotion to plan" {...fp}>
            <select name="attendance" value={formData.attendance||''} onChange={handleChange} className={errors.attendance?'invalid':''}>
              <option value="">— Select —</option>
              {ATTENDANCE_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field name="recurring" label="Is this a recurring event?" {...fp}>
            <select name="recurring" value={formData.recurring||''} onChange={handleChange}>
              <option value="">— Select —</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </Field>
          {formData.recurring === 'Yes' && (
            <Field name="recurrenceDetail" label="How often does it repeat?" required
                   hint="e.g., 'Monthly — First Tuesday', 'Every Wednesday', 'Quarterly'" {...fp}>
              <input type="text" name="recurrenceDetail" value={formData.recurrenceDetail||''} onChange={handleChange}
                     className={errors.recurrenceDetail?'invalid':''} placeholder="e.g., Monthly — First Tuesday" />
            </Field>
          )}
        </div>

        <div className="form-section">
          <h2>Contact Information</h2>
          <div className="row">
            <Field name="contactName" label="Your Name" required {...fp} />
            <Field name="contactEmail" label="Your Email" required type="email" {...fp} />
          </div>
        </div>

        <div className="form-section">
          <h2>Additional Details</h2>
          <Field name="cost" label="Cost to Attend" hint="Leave blank or enter 'Free' if no cost" {...fp} />
          <Field name="registrationLink" label="Registration Link" hint="If people need to sign up online" {...fp}>
            <input type="url" name="registrationLink" value={formData.registrationLink||''} onChange={handleChange} placeholder="https://..." />
          </Field>
          <FileUpload files={files} setFiles={setFiles} />
          <Field name="materialsLink" label="Link to Materials" hint="Google Drive, Dropbox, or any link to files we should use" {...fp}>
            <input type="url" name="materialsLink" value={formData.materialsLink||''} onChange={handleChange} placeholder="https://drive.google.com/..." />
          </Field>
          <Field name="notes" label="Anything Else We Should Know?" hint="Special instructions, timing details, setup needs, etc." {...fp}>
            <textarea name="notes" value={formData.notes||''} onChange={handleChange}
                      placeholder="Any other details that will help us promote your event..." />
          </Field>
          <label style={{display:'flex',alignItems:'flex-start',gap:'0.5rem',marginTop:'0.75rem',cursor:'pointer'}}>
            <input type="checkbox" name="requestConsultation" checked={!!formData.requestConsultation} onChange={handleChange}
                   style={{marginTop:'0.25rem'}} />
            <span>I'd like to speak with Pastor Scott or Christine Fanning about advertising details related to my event</span>
          </label>
        </div>

        <button type="submit" className="submit-btn" disabled={status==='submitting'}>
          {status==='submitting' ? 'Submitting...' : 'Submit Event'}
        </button>
        {status==='error' && <div className="status-msg error">{errorMsg}</div>}
      </form>
    );
  }

  // ─── ANNOUNCEMENT FORM ───────────────────────────────────────
  if (mode === 'announcement') {
    return (
      <form onSubmit={handleSubmit}>
        <span className="back-link" onClick={resetAll}>&larr; Back to options</span>

        <div className="intro">
          <strong>Post an announcement.</strong> Use this for news, updates, or information that doesn't have a specific event date — things like office closures, welcome messages, policy updates, or general church news. We'll get it into the bulletin and eNews.
          <br/><br/>
          <strong>Adding a link to any text field:</strong> put the URL in parentheses right after the text you want to make clickable — for example, <strong>Sign up here (https://signup.example.com)</strong>.
        </div>

        <div className="form-section">
          <h2>Announcement Details</h2>
          <Field name="announcementTitle" label="Title / Subject" required hint="A short headline for the announcement" {...fp} />
          <Field name="announcementText" label="Announcement Text" required hint="The full text you'd like shared" {...fp}>
            <textarea name="announcementText" value={formData.announcementText||''} onChange={handleChange}
                      className={errors.announcementText?'invalid':''}
                      placeholder="Write the announcement as you'd like it to appear..." />
          </Field>
          <Field name="audience" label="Who is this for?" required {...fp}>
            <select name="audience" value={formData.audience||''} onChange={handleChange} className={errors.audience?'invalid':''}>
              <option value="">— Select —</option>
              {AUDIENCE_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field name="duration" label="How long should this run?" required hint="How many weeks should this appear in the bulletin and eNews?" {...fp}>
            <select name="duration" value={formData.duration||''} onChange={handleChange} className={errors.duration?'invalid':''}>
              <option value="">— Select —</option>
              {ANNOUNCEMENT_DURATION_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </Field>
        </div>

        <div className="form-section">
          <h2>Contact Information</h2>
          <div className="row">
            <Field name="contactName" label="Your Name" required {...fp} />
            <Field name="contactEmail" label="Your Email" required type="email" {...fp} />
          </div>
        </div>

        <div className="form-section">
          <h2>Additional Details</h2>
          <FileUpload files={files} setFiles={setFiles} />

            <input type="checkbox" name="requestConsultation" checked={!!formData.requestConsultation} onChange={handleChange}
                   style={{marginTop:'0.25rem'}} />
            <span>I'd like to speak with Pastor Scott or Christine Fanning about distribution of this announcement</span>

        {status==='error' && <div className="status-msg error">{errorMsg}</div>}

  // ─── FUNDRAISER / COLLECTION FORM ────────────────────────────
  if (mode === 'fundraiser') {
    return (
      <form onSubmit={handleSubmit}>
        <span className="back-link" onClick={resetAll}>&larr; Back to options</span>

        <div className="intro">
          <strong>Submit a fundraiser or collection drive.</strong> Use this for campaigns that run over a period of time — annual offerings, food drives, mission trip fundraisers, school-supply collections, and so on. Some fundraisers conclude with a special event (e.g. delivering Christmas gifts for Kids Above All at their distribution center) — there's a section below to capture those details too. <strong>Lead time matters.</strong> Please submit at least <strong>3 weeks before the campaign starts</strong> for smaller drives, and at least <strong>6 weeks before</strong> for larger, community-facing campaigns (e.g., annual appeals, signature drives). The more lead time, the more we can do to promote it well.
          <br/><br/>
          <strong>Adding a link to any text field:</strong> put the URL in parentheses right after the text you want to make clickable — for example, <strong>Sign up here (https://signup.example.com)</strong>.
        </div>

        <div className="form-section">
          <h2>About the Fundraiser or Collection</h2>
          <Field name="fundraiserName" label="Fundraiser / Collection Name" required hint="e.g., 'Mothers for Mission 2026', 'Pill Bottle Collection', 'Youth Brunch & Serve'" {...fp} />
          <Field name="fundraiserType" label="Type" required {...fp}>
            <select name="fundraiserType" value={formData.fundraiserType||''} onChange={handleChange} className={errors.fundraiserType?'invalid':''}>
              <option value="">— Select —</option>
              {FUNDRAISER_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
          <Field name="cause" label="Who or what does this benefit?" required hint="The recipient organization, mission, ministry, or beneficiary" {...fp}>
            <textarea name="cause" value={formData.cause||''} onChange={handleChange}
                      className={errors.cause?'invalid':''}
                      placeholder="e.g., NIJFON (Northern Illinois Justice for Our Neighbors), the Youth Summer Mission Trip to Duluth, Matthew 25 Ministries pill-bottle program..." />
          </Field>
          <Field name="goal" label="Goal" hint="Optional but encouraging — a dollar target, item count, or other measurable goal" {...fp}>
            <input type="text" name="goal" value={formData.goal||''} onChange={handleChange}
                   placeholder="e.g., $5,000 / 200 lbs of food / 100 envelopes filled" />
          </Field>
          <Field name="description" label="Campaign Description" required hint="This will be the basis of all promo copy — explain the cause, why it matters, and the impact" {...fp}>
            <textarea name="description" value={formData.description||''} onChange={handleChange}
                      className={errors.description?'invalid':''}

        </div>

        <div className="form-section">
          <h2>Campaign Run Period</h2>
          <div className="row">
            <Field name="startDate" label="Start Date" required type="date" {...fp} />
            <Field name="endDate" label="End Date" required type="date" {...fp} />
          </div>
          <Field name="whatToDonate" label="What can people give?" required hint="Be specific so people know what's needed" {...fp}>
            <textarea name="whatToDonate" value={formData.whatToDonate||''} onChange={handleChange}
                      className={errors.whatToDonate?'invalid':''}
                      placeholder="e.g., 'non-perishable food items: peanut butter, canned vegetables, pasta, cereal' / 'monetary donations of any size' / 'clean prescription pill bottles, labels removed'" />
          </Field>
          <Field name="howToDonate" label="How can people give?" required hint="Drop-off location, online link, payment method, deadline reminders, etc." {...fp}>
            <textarea name="howToDonate" value={formData.howToDonate||''} onChange={handleChange}
                      className={errors.howToDonate?'invalid':''}
                      placeholder="e.g., 'Drop items in baskets at the Grant Place entrance' / 'Online via our website donation page' / 'Place envelopes in the basket in the Parlor' / 'Make checks payable to First UMC, memo: Mothers for Mission'" />
          </Field>
        </div>

        <div className="form-section">
          <h2>Promotion</h2>
          <Field name="reach" label="How big is this campaign?" required hint="Helps us decide how much promotion to plan" {...fp}>
            <select name="reach" value={formData.reach||''} onChange={handleChange} className={errors.reach?'invalid':''}>
              <option value="">— Select —</option>
              {FUNDRAISER_REACH_OPTIONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </Field>
        </div>

        <div className="form-section">
          <h2>Culminating Special Event</h2>
          <Field name="hasEvent" label="Does this fundraiser conclude with a special event?" required hint="e.g., a Mother's Day honor service, a celebration luncheon, an awards ceremony, the actual carwash day" {...fp}>
            <select name="hasEvent" value={formData.hasEvent||''} onChange={handleChange} className={errors.hasEvent?'invalid':''}>
              <option value="">— Select —</option>
              <option value="No">No — campaign only, no closing event</option>
              <option value="Yes">Yes — there's a special event tied to this fundraiser</option>
            </select>
          </Field>
          {formData.hasEvent === 'Yes' && (
            <div style={{borderLeft:'3px solid var(--purple)', paddingLeft:'1rem', marginTop:'0.5rem'}}>
              <Field name="eventName" label="Event Name" required hint="What's the closing event called?" {...fp}>
                <input type="text" name="eventName" value={formData.eventName||''} onChange={handleChange}
                       className={errors.eventName?'invalid':''}
                       placeholder="e.g., 'Mother's Day Honor Service', 'Carwash Day', 'Mission Trip Send-off Brunch'" />
              </Field>
              <div className="row">
                <Field name="eventDate" label="Event Date" required type="date" {...fp} />
                <Field name="location" label="Location" required hint="Where will the event happen?" {...fp}>
                  <input type="text" name="location" value={formData.location||''} onChange={handleChange}
                         className={errors.location?'invalid':''}
                         placeholder="e.g., Sanctuary, Jorgeson Hall, First UMC Parking Lot" />
                </Field>
              </div>
              <div className="row">
                <Field name="startTime" label="Start Time" type="time" {...fp} />
                <Field name="endTime" label="End Time" type="time" {...fp} />
              </div>
              <Field name="cost" label="Cost to Attend" hint="Leave blank or enter 'Free' if no cost" {...fp} />
              <Field name="registrationLink" label="Registration Link" hint="If people need to sign up online" {...fp}>
                <input type="url" name="registrationLink" value={formData.registrationLink||''} onChange={handleChange} placeholder="https://..." />
              </Field>
            </div>
          )}
        </div>

        <div className="form-section">
          <h2>Contact Information</h2>
          <div className="row">
            <Field name="contactName" label="Your Name" required {...fp} />
            <Field name="contactEmail" label="Your Email" required type="email" {...fp} />
          </div>
        </div>

        <div className="form-section">
          <h2>Additional Details</h2>
          <FileUpload files={files} setFiles={setFiles} />
          <Field name="materialsLink" label="Link to Materials" hint="Google Drive, Dropbox, or any link to flyers, photos, or supporting docs" {...fp}>
            <input type="url" name="materialsLink" value={formData.materialsLink||''} onChange={handleChange} placeholder="https://drive.google.com/..." />
          </Field>
          <Field name="notes" label="Anything Else We Should Know?" hint="Special instructions, partner organizations to credit, deadlines, sensitivities, etc." {...fp}>
            <textarea name="notes" value={formData.notes||''} onChange={handleChange}
                      placeholder="Any other details that will help us promote this well..." />
          </Field>
          <label style={{display:'flex',alignItems:'flex-start',gap:'0.5rem',marginTop:'0.75rem',cursor:'pointer'}}>
            <input type="checkbox" name="requestConsultation" checked={!!formData.requestConsultation} onChange={handleChange}
                   style={{marginTop:'0.25rem'}} />
            <span>I'd like to speak with Pastor Scott or Christine Fanning about how to promote this fundraiser</span>
          </label>
        </div>

        <button type="submit" className="submit-btn" disabled={status==='submitting'}>
          {status==='submitting' ? 'Submitting...' : 'Submit Fundraiser'}
        </button>
        {status==='error' && <div className="status-msg error">{errorMsg}</div>}
      </form>
    );
  }

  // ─── PRAYER REQUEST FORM ─────────────────────────────────────
  if (mode === 'prayer') {
    return (
      <form onSubmit={handleSubmit}>
        <span className="back-link" onClick={resetAll}>&larr; Back to options</span>

        <div className="intro">
          <strong>Share a prayer request.</strong> Prayers of concern, joy, grief, celebration, and thanksgiving are all welcome here. Pastor Scott reads every request personally.
        </div>

        <div className="form-section">
          <h2>Prayer Request</h2>
          <div className="privacy-note">
            You choose below where this prayer is shared. Whatever you write here stays confidential with Pastor Scott — only a publication version, written to match your sharing preference, ever appears in print.
          </div>
          <Field name="prayerFor" label="Who is this prayer for?" required hint="A name, a family, or a situation — including yourself" {...fp} />
          <Field name="prayerType" label="What kind of prayer is this?" hint="Optional — it's not only for hard news" {...fp}>
            <select name="prayerType" value={formData.prayerType||''} onChange={handleChange}>
              <option value="">— Select (optional) —</option>
              {PRAYER_TYPE_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </Field>
          <Field name="prayerRequest" label="Prayer Request Details" required hint="Share as much or as little as you'd like — this stays confidential with Pastor Scott" {...fp}>
            <textarea name="prayerRequest" value={formData.prayerRequest||''} onChange={handleChange}
                      className={errors.prayerRequest?'invalid':''}
                      placeholder="Please share what you'd like us to pray for..." />
          </Field>
          <Field name="prayerDistribution" label="Where would you like this prayer shared?" required hint="If you're praying for someone else by name, please make sure they're comfortable with your choice" {...fp}>
            <select name="prayerDistribution" value={formData.prayerDistribution||''} onChange={handleChange}
                    className={errors.prayerDistribution?'invalid':''}>
              <option value="">— Select —</option>
              {PRAYER_DISTRIBUTION_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </Field>
          <label style={{display:'flex',alignItems:'flex-start',gap:'0.5rem',marginTop:'0.75rem',cursor:'pointer'}}>
            <input type="checkbox" name="pastorFollowUp" checked={!!formData.pastorFollowUp} onChange={handleChange}
                   style={{marginTop:'0.25rem'}} />
            <span>I'd like Pastor Scott to reach out to me personally about this.</span>
          </label>
        </div>

        <div className="form-section">
          <h2>Your Information</h2>
          <div className="row">
            <Field name="contactName" label="Your Name" required hint="So we can follow up if needed" {...fp} />
            <Field name="contactEmail" label="Your Email" required type="email" {...fp} />
          </div>
          <Field name="prayerNotes" label="Anything Else?" hint="Additional context, updates, or special instructions — e.g., use first name only, or please don't share my name publicly" {...fp}>
            <textarea name="prayerNotes" value={formData.prayerNotes||''} onChange={handleChange}
                      placeholder="Optional — any additional details..." />
          </Field>
        </div>

        <button type="submit" className="submit-btn" disabled={status==='submitting'}>
          {status==='submitting' ? 'Submitting...' : 'Submit Prayer Request'}
        </button>
        {status==='error' && <div className="status-msg error">{errorMsg}</div>}
      </form>
    );
  }

  // ─── EVENT RECAP FORM ────────────────────────────────────────
  if (mode === 'recap') {
    return (
      <form onSubmit={handleSubmit}>
        <span className="back-link" onClick={resetAll}>&larr; Back to options</span>

        <div className="intro">
          Submit photos or a short video from a church event you attended, along with a brief reflection on what happened.
          Photos upload right here; most videos are too large to upload, so there is a place below to paste a link to one instead.
          <br/><br/>
          <strong>Adding a link to any text field:</strong> put the URL in parentheses right after the text you want to make clickable — for example, <strong>Sign up here (https://signup.example.com)</strong>.
        </div>

        <div className="form-section">
          <h2>What Happened</h2>
          <Field name="eventName" label="Event Name or Title" required hint="What event are these photos from? (e.g., 'Sunday Night Supper, April 27' or 'Confirmation Sunday')" {...fp} />
          <Field name="eventDate" label="When Did It Happen?" type="date" hint="Optional — helps us file the photos correctly" {...fp} />
          <Field name="reflection" label="A Reflection on What Happened" required hint="A few sentences, a paragraph, or a few paragraphs — whatever feels right. Tell us what stood out, who was there, what was meaningful." {...fp}>
            <textarea name="reflection" value={formData.reflection||''} onChange={handleChange}
                      className={errors.reflection?'invalid':''}
                      placeholder="What happened? What stood out? What would you want others to know?" />
          </Field>
        </div>

        <div className="form-section">
          <h2>Photos</h2>
          <FileUpload
            files={files}
            setFiles={setFiles}
            label="Upload Photos"
            hint="JPG, PNG, HEIC, or GIF — landscape and close-ups are both welcome"
            accept="image/*"
            photosOnly
          />
        </div>

        <div className="form-section">
          <h2>Video</h2>
          <VideoUpload video={video} setVideo={setVideo} photoBytes={files.reduce((sum, f) => sum + f.size, 0)} />
          <Field name="materialsLink" label="Video Link" hint="The reliable way to send video, and the place for extra photos too — a Google Photos, Google Drive, Dropbox, or iCloud share link" {...fp}>
            <input type="url" name="materialsLink" value={formData.materialsLink||''} onChange={handleChange} placeholder="https://photos.app.goo.gl/..." />
          </Field>
        </div>

        <div className="form-section">
          <h2>Your Information</h2>
          <div className="row">
            <Field name="contactName" label="Your Name" required {...fp} />
            <Field name="contactEmail" label="Your Email" required type="email" hint="We'll send you a confirmation that we received this" {...fp} />
          </div>
          <Field name="notes" label="Anything Else We Should Know?" hint="Names of people in photos who might want a heads-up, things to call out or avoid, etc." {...fp}>
            <textarea name="notes" value={formData.notes||''} onChange={handleChange}
                      placeholder="Optional — any additional context..." />
          </Field>
        </div>

        <button type="submit" className="submit-btn" disabled={status==='submitting'}>
          {status==='submitting' ? 'Submitting...' : 'Share Photos'}
        </button>
        {status==='error' && <div className="status-msg error">{errorMsg}</div>}
      </form>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
